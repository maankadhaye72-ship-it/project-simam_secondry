<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simam Secondary School - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <h2>Simam School</h2>
        <button>🏠 Dashboard</button>
        <button>👨‍🎓 Ardayda</button>
        <button>📚 Macalimiinta</button>
        <button>📊 Natiijooyinka</button>
        <button>⚙️ Settings</button>
    </div>

    <div class="main-content">
        <header>
            <span>Welcome, <strong>Admin</strong></span>
            <span>Simam Secondary School Dashboard</span>
        </header>

        <div class="school-banner">
            SIMAM SECONDARY SCHOOL
        </div>

        <div class="forms-container">
            
            <div class="form-card">
                <h3>Diiwaangeli Arday</h3>
                <form>
                    <input type="text" placeholder="Magaca oo dhamaystiran">
                    <input type="text" placeholder="Fasalka">
                    <input type="number" placeholder="Da'da">
                    <button type="submit" class="submit-btn">Keydi Ardayga</button>
                </form>
            </div>

            <div class="form-card">
                <h3>Kudar Macalin</h3>
                <form>
                    <input type="text" placeholder="Magaca Macalinka">
                    <input type="text" placeholder="Maadada uu dhigo">
                    <input type="email" placeholder="Email-ka">
                    <button type="submit" class="submit-btn">Keydi Macalinka</button>
                </form>
            </div>

            <div class="form-card">
                <h3>Fariin/Cabasho</h3>
                <form>
                    <input type="text" placeholder="Subject">
                    <textarea rows="4" placeholder="Halkan ku qor fariintaada..."></textarea>
                    <button type="submit" class="submit-btn">Dir Fariinta</button>
                </form>
            </div>

        </div>
    </div>

</body>
</html>
